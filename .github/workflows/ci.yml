name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Static check & build (site)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Generate Astro types
        working-directory: site
        run: npx astro sync

      - name: TypeScript check
        working-directory: site
        run: npx tsc --noEmit

      - name: Build
        working-directory: site
        run: npm run build
